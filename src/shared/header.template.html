<header class="fixed top-0 left-0 right-0 z-50 bg-paper/90 backdrop-blur-md border-b border-gridBorder">
    <div id="site-header-row" class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">

      <!-- Brand & Infinity Logo -->
      <a id="site-brand" href="{{home}}" class="flex items-center gap-2 sm:gap-3 shrink-0 group min-w-0 rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emeraldAccent">
        <div class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded bg-darkBg text-white transition-transform group-hover:scale-105 shadow-sm shrink-0">
          <!-- Infinity N Monogram SVG -->
          <svg aria-hidden="true" class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 68V36C22 28 30 24 38 28C46 32 54 48 62 64C70 80 82 78 86 68C90 58 84 46 72 46C62 46 54 60 48 68"
                  stroke="url(#infinityGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="22" cy="68" r="4" fill="#34D399"/>
            <defs>
              <linearGradient id="infinityGrad" x1="20" y1="20" x2="88" y2="80" gradientUnits="userSpaceOnUse">
                <stop stop-color="#34D399"/>
                <stop offset="0.6" stop-color="#34D399"/>
                <stop offset="1" stop-color="#FFFFFF"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="font-heading font-extrabold text-sm sm:text-base tracking-tight leading-none text-darkBg whitespace-nowrap">
            {{brandFirst}} <span class="text-emeraldAccent lg:hidden xl:inline">{{brandRest}}</span>
          </span>
          <span class="hidden sm:block lg:hidden xl:block font-sans text-[10px] text-textMuted tracking-wider uppercase mt-0.5 whitespace-nowrap">Engineering & Solutions</span>
        </div>
      </a>

      <nav aria-label="Основная навигация" class="hidden lg:flex items-center gap-3 xl:gap-4 text-[13px] xl:text-sm font-medium text-textMain font-sans whitespace-nowrap">
{{desktopGroups}}
{{desktopPages}}
      </nav>

      <div id="desktop-contacts" class="hidden lg:flex items-center gap-3 shrink-0">
        <a id="desktop-email" href="mailto:{{email}}" aria-label="{{email}}" class="inline-flex items-center gap-1.5 rounded border border-gridBorder bg-white px-2.5 py-1.5 text-xs font-sans text-textMuted whitespace-nowrap hover:text-darkBg transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emeraldAccent">
          <svg aria-hidden="true" class="w-3.5 h-3.5 shrink-0 text-emeraldAccent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></svg>
          <span class="lg:hidden xl:inline">{{email}}</span>
        </a>
        <a id="desktop-whatsapp" href="{{ctaHref}}" target="_blank" rel="noopener noreferrer"
           aria-label="{{ctaLabel}}: {{phone}}" title="WhatsApp: {{phone}}"
           class="inline-flex items-center justify-center w-11 h-11 bg-emeraldAccent hover:bg-emeraldHover text-white rounded-[35%] transition-colors shadow-sm shrink-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emeraldAccent">
          <svg aria-hidden="true" class="w-4 h-4 sm:w-5 sm:h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" /></svg>
        </a>
      </div>

      <button type="button" id="mobile-menu-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Открыть меню разделов"
           class="lg:hidden inline-flex items-center justify-center w-11 h-11 rounded border border-gridBorder bg-white text-darkBg shrink-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emeraldAccent">
          <svg aria-hidden="true" id="mobile-menu-icon-open" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16" /> <path d="M4 6h16" /> <path d="M4 18h16" /></svg>
          <svg aria-hidden="true" id="mobile-menu-icon-close" class="hidden w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg>
        </button>
    </div>

    <nav id="mobile-menu" aria-label="Меню разделов" aria-hidden="true" inert class="hidden lg:hidden border-t border-gridBorder bg-paper max-h-[calc(100dvh-4rem)] overflow-y-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col gap-1 text-sm font-medium text-textMain font-sans">
{{mobileGroups}}
{{mobilePages}}
        <div id="mobile-contacts" class="mt-2 grid grid-cols-[auto_minmax(0,1fr)] gap-2">
          <a id="mobile-email" href="mailto:{{email}}" class="inline-flex items-center justify-center gap-1.5 rounded border border-gridBorder bg-white px-2.5 py-3 text-xs font-sans text-textMuted whitespace-nowrap hover:text-darkBg transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emeraldAccent">
            <svg aria-hidden="true" class="w-3.5 h-3.5 shrink-0 text-emeraldAccent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></svg>
            <span>{{email}}</span>
          </a>
          <a id="mobile-whatsapp" href="{{ctaHref}}" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center justify-center rounded bg-emeraldAccent px-2 py-3 text-center text-xs font-semibold text-white hover:bg-emeraldHover transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emeraldAccent">
            {{ctaLabel}}
          </a>
        </div>
      </div>
    </nav>
  </header>
