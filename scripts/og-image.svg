<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mark" x1="20" y1="20" x2="88" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B6B44"/>
      <stop offset="0.6" stop-color="#34D399"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2A2E35" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#141619"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- logo mark -->
  <rect x="90" y="80" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#2A2E35"/>
  <g transform="translate(90,80) scale(0.64)">
    <path d="M22 68V36C22 28 30 24 38 28C46 32 54 48 62 64C70 80 82 78 86 68C90 58 84 46 72 46C62 46 54 60 48 68"
          stroke="url(#mark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="22" cy="68" r="4" fill="#1B6B44"/>
  </g>
  <text x="170" y="122" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">NEXCEL<tspan fill="#34D399">.KZ</tspan></text>

  <!-- badge -->
  <rect x="90" y="182" width="392" height="34" rx="6" fill="#0B2A1C" stroke="#145333"/>
  <text x="110" y="204" font-family="'JetBrains Mono', monospace" font-size="14" fill="#34D399" letter-spacing="0.5">B2B &amp; B2G ИНТЕГРАТОР · Г. АСТАНА · ЭСФ / АВР</text>

  <!-- headline -->
  <text x="90" y="290" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" letter-spacing="-1">Оцифровка бизнеса, ИИ</text>
  <text x="90" y="352" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" letter-spacing="-1">и Telegram-боты</text>

  <!-- subtext -->
  <text x="90" y="404" font-family="Inter, Arial, sans-serif" font-size="22" fill="#94A3B8">Учет в Google Таблицах, Telegram-боты с ИИ, OCR-распознавание</text>
  <text x="90" y="434" font-family="Inter, Arial, sans-serif" font-size="22" fill="#94A3B8">документов и лицензии ПО. Оплата в тенге.</text>

  <!-- footer -->
  <text x="90" y="558" font-family="'JetBrains Mono', monospace" font-size="16" fill="#5A5E67">Nexcel Solutions · Казахстан</text>
  <text x="1000" y="558" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" fill="#34D399" text-anchor="end">nexcel.kz</text>
  <line x1="90" y1="530" x2="1110" y2="530" stroke="#2A2E35" stroke-width="1"/>
</svg>
